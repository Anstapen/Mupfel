name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: "1.4.357.0"
  PREMAKE_VERSION: "5.0.0-beta8"

jobs:
  windows:
    name: Windows / ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:VULKAN_SDK_VERSION
          $root = "C:\VulkanSDK\$ver"
          $exe = "$env:RUNNER_TEMP\vulkan_sdk.exe"

          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe" -OutFile $exe
          Write-Host "Downloaded $((Get-Item $exe).Length) bytes to $exe"

          $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -ArgumentList @(
            "--root", $root,
            "--accept-licenses", "--default-answer", "--confirm-command",
            "install"
          )
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer failed with exit code $($p.ExitCode)" }

      - name: Verify Vulkan SDK and export VULKAN_SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          $missing = @()
          if (-not (Test-Path (Join-Path $root "Include/vulkan/vulkan.h"))) { $missing += "Include/vulkan/vulkan.h" }
          # Either name is acceptable; Build.lua probes for the same two and links whichever
          # this SDK ships. Echo the winner so a future rename is visible in the log.
          $lib = @("Lib/vulkan-1.lib", "Lib/vulkan.lib") | Where-Object { Test-Path (Join-Path $root $_) }
          if ($lib) { Write-Host "Loader import library: $lib" }
          else { $missing += "Lib/vulkan-1.lib or Lib/vulkan.lib" }
          if ($missing) {
            Write-Host "Contents of C:\VulkanSDK:"
            if (Test-Path "C:\VulkanSDK") {
              Get-ChildItem "C:\VulkanSDK" -Recurse -Depth 2 | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "  (C:\VulkanSDK does not exist)"
            }
            throw "Vulkan SDK install incomplete at ${root}: missing $($missing -join ', ')"
          }
          Write-Host "Vulkan SDK OK at $root"
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate solution
        run: Vendor\Binaries\Premake\Windows\premake5.exe --file=Build.lua vs2022

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Mupfel.sln -p:Configuration=${{ matrix.config }} -p:Platform=x64 -m

      - name: Run tests
        run: .\Binaries\windows-x86_64\${{ matrix.config }}\Tests\Tests.exe

  linux:
    name: Ubuntu / ${{ matrix.config }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain and system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-19 libstdc++-14-dev libglfw3-dev

      - name: Cache Vulkan SDK
        id: vulkan-sdk-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/VulkanSDK
          key: vulkan-sdk-linux-${{ env.VULKAN_SDK_VERSION }}

      - name: Install Vulkan SDK
        if: steps.vulkan-sdk-cache.outputs.cache-hit != 'true'
        run: |
          ver="$VULKAN_SDK_VERSION"
          mkdir -p "$RUNNER_TEMP/VulkanSDK"
          curl -fsSL "https://sdk.lunarg.com/sdk/download/$ver/linux/vulkansdk-linux-x86_64-$ver.tar.xz" \
            | tar -xJ -C "$RUNNER_TEMP/VulkanSDK" "$ver/x86_64/include" "$ver/x86_64/lib/VulkanLoader"

      - name: Verify Vulkan SDK and export VULKAN_SDK
        run: |
          root="$RUNNER_TEMP/VulkanSDK/$VULKAN_SDK_VERSION/x86_64"
          for f in include/vulkan/vulkan_core.h lib/VulkanLoader/lib/libvulkan.so; do
            if [ ! -e "$root/$f" ]; then
              echo "Contents of $RUNNER_TEMP/VulkanSDK:"
              find "$RUNNER_TEMP/VulkanSDK" -maxdepth 4
              echo "::error::Vulkan SDK install incomplete at $root: missing $f"
              exit 1
            fi
          done
          echo "Vulkan SDK OK at $root"
          echo "VULKAN_SDK=$root" >> "$GITHUB_ENV"

      - name: Generate makefiles
        run: Vendor/Binaries/Premake/Linux/premake5 --cc=clang --file=Build.lua gmake

      - name: Build
        env:
          CC: clang-19
          CXX: clang++-19
          CONFIG: ${{ matrix.config }}
        run: make config="${CONFIG,,}" -j"$(nproc)"

      - name: Run tests
        env:
          LD_LIBRARY_PATH: ${{ env.VULKAN_SDK }}/lib/VulkanLoader/lib
        run: ./Binaries/linux-x86_64/${{ matrix.config }}/Tests/Tests
