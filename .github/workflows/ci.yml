name: CI

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  VULKAN_SDK_VERSION: "1.4.357.0"
  PREMAKE_VERSION: "5.0.0-beta8"

jobs:
  windows:
    name: Windows / ${{ matrix.config }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        config: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      - name: Install Vulkan SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $ver = $env:VULKAN_SDK_VERSION
          $root = "C:\VulkanSDK\$ver"
          $exe = "$env:RUNNER_TEMP\vulkan_sdk.exe"

          Invoke-WebRequest -Uri "https://sdk.lunarg.com/sdk/download/$ver/windows/vulkan_sdk.exe" -OutFile $exe
          Write-Host "Downloaded $((Get-Item $exe).Length) bytes to $exe"

          $p = Start-Process -FilePath $exe -NoNewWindow -Wait -PassThru -ArgumentList @(
            "--root", $root,
            "--accept-licenses", "--default-answer", "--confirm-command",
            "install"
          )
          Write-Host "Installer exit code: $($p.ExitCode)"
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer failed with exit code $($p.ExitCode)" }

      - name: Verify Vulkan SDK and export VULKAN_SDK
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "C:\VulkanSDK\$env:VULKAN_SDK_VERSION"
          $missing = @()
          if (-not (Test-Path (Join-Path $root "Include/vulkan/vulkan.h"))) { $missing += "Include/vulkan/vulkan.h" }
          # Either name is acceptable; Build.lua probes for the same two and links whichever
          # this SDK ships. Echo the winner so a future rename is visible in the log.
          $lib = @("Lib/vulkan-1.lib", "Lib/vulkan.lib") | Where-Object { Test-Path (Join-Path $root $_) }
          if ($lib) { Write-Host "Loader import library: $lib" }
          else { $missing += "Lib/vulkan-1.lib or Lib/vulkan.lib" }
          if ($missing) {
            Write-Host "Contents of C:\VulkanSDK:"
            if (Test-Path "C:\VulkanSDK") {
              Get-ChildItem "C:\VulkanSDK" -Recurse -Depth 2 | ForEach-Object { Write-Host "  $($_.FullName)" }
            } else {
              Write-Host "  (C:\VulkanSDK does not exist)"
            }
            throw "Vulkan SDK install incomplete at ${root}: missing $($missing -join ', ')"
          }
          Write-Host "Vulkan SDK OK at $root"
          "VULKAN_SDK=$root" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Generate solution
        run: Vendor\Binaries\Premake\Windows\premake5.exe --file=Build.lua vs2022

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: msbuild Mupfel.sln -p:Configuration=${{ matrix.config }} -p:Platform=x64 -m

      - name: Run tests
        run: .\Binaries\windows-x86_64\${{ matrix.config }}\Tests\Tests.exe
